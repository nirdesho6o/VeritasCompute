<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeritasCompute Explainer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f1a; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 800, H = 450;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

const LOOP = 12000;
let start = null;

// Colors
const BG = '#0f0f1a';
const BLUE = '#4a9eff';
const GREEN = '#3fb950';
const ORANGE = '#d29922';
const RED = '#f85149';
const WHITE = '#e6edf3';
const DIM = '#8b949e';
const DARK = '#161b22';
const PURPLE = '#bc8cff';

function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }
function ease(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }
function easeOut(t) { return 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3); }

// --- Drawing primitives ---
function drawRobot(x, y, scale, color, eyeColor) {
  const s = scale;
  ctx.save();
  ctx.translate(x, y);
  // Body
  ctx.fillStyle = color;
  ctx.fillRect(-12*s, 5*s, 24*s, 28*s);
  // Head
  ctx.beginPath();
  ctx.arc(0, -5*s, 14*s, 0, Math.PI*2);
  ctx.fill();
  // Eyes
  ctx.fillStyle = eyeColor || WHITE;
  ctx.beginPath();
  ctx.arc(-5*s, -7*s, 3*s, 0, Math.PI*2);
  ctx.arc(5*s, -7*s, 3*s, 0, Math.PI*2);
  ctx.fill();
  // Antenna
  ctx.strokeStyle = color;
  ctx.lineWidth = 2*s;
  ctx.beginPath();
  ctx.moveTo(0, -19*s);
  ctx.lineTo(0, -26*s);
  ctx.stroke();
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.arc(0, -28*s, 3*s, 0, Math.PI*2);
  ctx.fill();
  // Arms
  ctx.fillStyle = color;
  ctx.fillRect(-18*s, 8*s, 6*s, 18*s);
  ctx.fillRect(12*s, 8*s, 6*s, 18*s);
  // Legs
  ctx.fillRect(-10*s, 33*s, 7*s, 12*s);
  ctx.fillRect(3*s, 33*s, 7*s, 12*s);
  ctx.restore();
}

function drawFile(x, y, w, h, glowColor, glowAlpha) {
  ctx.save();
  ctx.translate(x, y);
  // Shadow/glow
  if (glowColor && glowAlpha > 0) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 20 * glowAlpha;
  }
  // File shape
  const fold = 12;
  ctx.fillStyle = '#1c2333';
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w - fold, 0);
  ctx.lineTo(w, fold);
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Fold
  ctx.beginPath();
  ctx.moveTo(w - fold, 0);
  ctx.lineTo(w - fold, fold);
  ctx.lineTo(w, fold);
  ctx.strokeStyle = '#30363d';
  ctx.stroke();
  // Code lines
  ctx.shadowBlur = 0;
  const lineColors = ['#58a6ff', '#3fb950', DIM, '#d29922', DIM];
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = lineColors[i];
    ctx.globalAlpha = 0.6;
    ctx.fillRect(8, 18 + i*10, 15 + Math.sin(i*2.3)*20 + 15, 4);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawCoin(x, y, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = '#0f0f1a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(x, y, r, r*0.65, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#0f0f1a';
  ctx.font = `bold ${r}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', x, y);
  ctx.restore();
}

function drawSpeechBubble(x, y, text, tailDir, bgColor) {
  ctx.save();
  const m = ctx.measureText(text);
  const pw = m.width + 16;
  const ph = 22;
  ctx.fillStyle = bgColor || '#21262d';
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  // Rounded rect
  const rx = x - pw/2, ry = y - ph/2;
  ctx.beginPath();
  ctx.roundRect(rx, ry, pw, ph, 6);
  ctx.fill();
  ctx.stroke();
  // Tail
  ctx.beginPath();
  if (tailDir === 'down') {
    ctx.moveTo(x - 5, y + ph/2);
    ctx.lineTo(x, y + ph/2 + 8);
    ctx.lineTo(x + 5, y + ph/2);
  }
  ctx.fillStyle = bgColor || '#21262d';
  ctx.fill();
  // Text
  ctx.fillStyle = WHITE;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGavel(x, y, angle, scale) {
  const s = scale;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  // Handle
  ctx.fillStyle = '#8b6914';
  ctx.fillRect(-2*s, 0, 4*s, 30*s);
  // Head
  ctx.fillStyle = '#a07d1c';
  ctx.fillRect(-10*s, -6*s, 20*s, 10*s);
  ctx.restore();
}

function drawTerminal(x, y, w, h, lines, progress) {
  ctx.save();
  ctx.fillStyle = '#0a0a0a';
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.stroke();
  // Title bar
  ctx.fillStyle = '#21262d';
  ctx.fillRect(x, y, w, 14);
  // Dots
  [RED, ORANGE, GREEN].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(x + 10 + i*12, y + 7, 3, 0, Math.PI*2);
    ctx.fill();
  });
  // Lines
  ctx.font = '9px monospace';
  const maxLines = Math.floor(progress * lines.length);
  for (let i = 0; i < maxLines && i < lines.length; i++) {
    ctx.fillStyle = lines[i][1] || GREEN;
    ctx.fillText(lines[i][0], x + 6, y + 26 + i*12);
  }
  ctx.restore();
}

function drawCoinStack(x, y, count, color, maxCount) {
  const mc = maxCount || 10;
  for (let i = 0; i < Math.min(count, mc); i++) {
    drawCoin(x, y - i*7, 10, color);
  }
}

function drawStamp(x, y, text, color, alpha, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation || -0.2);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const m = ctx.measureText(text);
  const pw = m.width + 20, ph = 34;
  ctx.beginPath();
  ctx.roundRect(-pw/2, -ph/2, pw, ph, 4);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.fillText(text, 0, 0);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// --- Scenes ---
function scene1(t) { // 0-2s: The Problem
  const p = t / 2000;
  // Title
  ctx.fillStyle = WHITE;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.globalAlpha = ease(p * 3);
  ctx.fillText('The Problem', W/2, 40);
  ctx.globalAlpha = 1;

  // Robot slides in
  const rx = lerp(-50, 250, easeOut(p * 2));
  drawRobot(rx, 200, 1.8, BLUE, WHITE);

  // File slides from robot
  const fp = easeOut(Math.max(0, (p - 0.3) * 2.5));
  const fx = lerp(280, 430, fp);
  const pulseAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t / 200));
  drawFile(fx, 160, 70, 80, RED, pulseAlpha * fp);

  // Warning icon inside file
  if (fp > 0.5) {
    ctx.save();
    ctx.globalAlpha = pulseAlpha * Math.min(1, (fp - 0.5) * 4);
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚠️', fx + 35, 220);
    ctx.restore();
  }

  // Subtitle
  ctx.globalAlpha = ease(Math.max(0, p - 0.4) * 3);
  ctx.fillStyle = DIM;
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('An AI agent submits code... with something hidden inside', W/2, H - 50);
  ctx.globalAlpha = 1;
}

function scene2(t) { // 2-5s: The Monitors
  const p = (t - 2000) / 3000;

  ctx.fillStyle = WHITE;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('The Monitors', W/2, 40);

  // File in center
  drawFile(370, 100, 60, 70, RED, 0.3 + 0.3 * Math.sin(t/200));

  // Green monitor appears
  const gp = easeOut(p * 3);
  const gx = lerp(-50, 180, gp);
  drawRobot(gx, 220, 1.6, GREEN, WHITE);
  if (gp > 0.5) {
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('HONEST', gx, 295);
  }

  // Orange monitor appears
  const op = easeOut(Math.max(0, p - 0.1) * 3);
  const ox = lerp(850, 620, op);
  drawRobot(ox, 220, 1.6, ORANGE, WHITE);
  if (op > 0.5) {
    ctx.fillStyle = ORANGE;
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SYBIL', ox, 295);
  }

  // Speech bubbles
  const bp = Math.max(0, p - 0.4) * 3;
  if (bp > 0) {
    ctx.globalAlpha = ease(Math.min(1, bp));
    drawSpeechBubble(ox, 140, '🚨 99% DANGER!!! 🚨', 'down', '#3d1515');
    ctx.globalAlpha = 1;
  }
  const bp2 = Math.max(0, p - 0.55) * 3;
  if (bp2 > 0) {
    ctx.globalAlpha = ease(Math.min(1, bp2));
    drawSpeechBubble(gx, 150, '87% suspicious', 'down', '#1a2d1a');
    ctx.globalAlpha = 1;
  }

  // Coins being placed
  const cp = Math.max(0, p - 0.7) * 4;
  if (cp > 0) {
    ctx.globalAlpha = ease(Math.min(1, cp));
    // Table
    ctx.fillStyle = '#1c2333';
    ctx.fillRect(280, 330, 240, 8);
    // Coin stacks
    const gc = Math.floor(lerp(0, 4, Math.min(1, cp)));
    const oc = Math.floor(lerp(0, 6, Math.min(1, cp)));
    drawCoinStack(340, 325, gc, GREEN);
    drawCoinStack(460, 325, oc, ORANGE);
    // Labels
    ctx.fillStyle = DIM;
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('bid: $30', 340, 345);
    ctx.fillText('bid: $50', 460, 345);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = DIM;
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Both submit calibrated bids for sandbox compute', W/2, H - 30);
}

function scene3(t) { // 5-7s: The Auction
  const p = (t - 5000) / 2000;

  ctx.fillStyle = WHITE;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('The VCG Auction', W/2, 40);

  // Gavel animation
  const gavelP = Math.min(1, p * 4);
  const gavelAngle = gavelP < 0.5 ? lerp(-0.8, 0, ease(gavelP * 2)) : lerp(0, -0.1, (gavelP - 0.5) * 2);
  drawGavel(W/2, 90, gavelAngle, 2);

  if (gavelP > 0.45 && gavelP < 0.6) {
    // Impact flash
    ctx.fillStyle = PURPLE;
    ctx.globalAlpha = 1 - (gavelP - 0.45) * 7;
    ctx.beginPath();
    ctx.arc(W/2, 120, 30, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // VCG label
  if (p > 0.25) {
    ctx.globalAlpha = ease((p - 0.25) * 4);
    ctx.fillStyle = PURPLE;
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('BOTH ALLOCATED', W/2, 135);
    ctx.globalAlpha = 1;
  }

  // Two terminals
  const tp = Math.max(0, p - 0.35) * 2.5;
  if (tp > 0) {
    const termProgress = Math.min(1, tp);
    drawTerminal(60, 160, 310, 110, [
      ['$ pytest test_exploit.py', DIM],
      ['Running sandbox (honest)...', GREEN],
      ['FOUND: time.perf_counter mocked', GREEN],
      ['assert real_elapsed > 0.4  ✓ CAUGHT', GREEN],
      ['1 passed', GREEN],
    ], termProgress);

    drawTerminal(430, 160, 310, 110, [
      ['$ pytest test_exploit.py', DIM],
      ['Running sandbox (sybil)...', ORANGE],
      ['assert True  # generic check', ORANGE],
      ['0 assertions, 0 findings', RED],
      ['nothing detected  ✗', RED],
    ], termProgress);

    // Result badges
    if (termProgress > 0.8) {
      ctx.globalAlpha = ease((termProgress - 0.8) * 5);
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = GREEN;
      ctx.fillText('✓', 215, 300);
      ctx.fillStyle = RED;
      ctx.fillText('✗', 585, 300);
      ctx.globalAlpha = 1;
    }
  }

  ctx.fillStyle = DIM;
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Sandbox tests run — the honest monitor catches the exploit', W/2, H - 30);
}

function scene4(t) { // 7-10s: The Reckoning
  const p = (t - 7000) / 3000;

  ctx.fillStyle = WHITE;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('The Reckoning', W/2, 40);

  // Characters
  drawRobot(200, 170, 1.3, GREEN, WHITE);
  drawRobot(600, 170, 1.3, ORANGE, WHITE);

  ctx.fillStyle = GREEN;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('HONEST', 200, 240);
  ctx.fillStyle = ORANGE;
  ctx.fillText('SYBIL', 600, 240);

  // Simulate 3 rounds of bankroll changes
  const rounds = 3;
  const roundDur = 1 / rounds;

  let greenStack = 5;
  let orangeStack = 5;

  for (let r = 0; r < rounds; r++) {
    const rp = (p - r * roundDur) / roundDur;
    if (rp > 0 && rp <= 1) {
      const rpe = ease(Math.min(1, rp * 2));
      greenStack = 5 + (r + 1) * 2;
      orangeStack = Math.max(0, 5 - (r + 1) * 2);

      // Flying coins to green
      if (rp < 0.5) {
        const fp = rp * 2;
        ctx.fillStyle = GREEN;
        ctx.globalAlpha = 1 - fp;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('+$$', 200, lerp(340, 290, fp));
        ctx.globalAlpha = 1;
      }
      // Flying coins away from orange
      if (rp < 0.5) {
        const fp = rp * 2;
        ctx.fillStyle = RED;
        ctx.globalAlpha = 1 - fp;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('-$$', 600, lerp(290, 250, fp));
        ctx.globalAlpha = 1;
      }
    } else if (rp > 1) {
      greenStack = 5 + (r + 1) * 2;
      orangeStack = Math.max(0, 5 - (r + 1) * 2);
    }
  }

  // Coin stacks
  drawCoinStack(200, 400, Math.floor(greenStack), GREEN, 12);
  drawCoinStack(600, 400, Math.floor(orangeStack), ORANGE, 12);

  // Round counter
  const currentRound = Math.min(rounds, Math.floor(p * rounds) + 1);
  ctx.fillStyle = DIM;
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`Round ${currentRound} / ${rounds}`, W/2, 300);

  // Brier formula hint
  ctx.fillStyle = PURPLE;
  ctx.font = '11px monospace';
  ctx.fillText('ΔW = α·((1-(y-p)²) - 0.75) - q', W/2, 330);

  ctx.fillStyle = DIM;
  ctx.font = '14px sans-serif';
  ctx.fillText('Centered Brier scoring: truthful critics earn, noisy ones bleed', W/2, H - 30);
}

function scene5(t) { // 10-12s: The Result
  const p = (t - 10000) / 2000;

  ctx.fillStyle = WHITE;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.globalAlpha = ease(p * 3);
  ctx.fillText('The Result', W/2, 40);
  ctx.globalAlpha = 1;

  // Green monitor - glowing, triumphant
  const glow = 0.3 + 0.2 * Math.sin(t / 300);
  ctx.save();
  ctx.shadowColor = GREEN;
  ctx.shadowBlur = 30 * glow * ease(p * 2);
  drawRobot(250, 200, 2.0, GREEN, WHITE);
  ctx.restore();

  // Coin stack for green
  const gs = Math.floor(lerp(0, 12, easeOut(p * 2)));
  drawCoinStack(250, 400, gs, GREEN, 12);

  // Orange monitor - grayed out
  const fadeP = ease(Math.min(1, p * 2));
  ctx.globalAlpha = lerp(1, 0.25, fadeP);
  drawRobot(580, 200, 2.0, '#555', '#777');
  ctx.globalAlpha = 1;

  // Empty coin area for orange
  drawCoinStack(580, 400, 0, ORANGE, 12);

  // BANKRUPT stamp
  if (p > 0.3) {
    const stampP = ease((p - 0.3) * 3);
    drawStamp(580, 280, 'BANKRUPT', RED, stampP, -0.15);
  }

  // Trusted badge for green
  if (p > 0.4) {
    ctx.globalAlpha = ease((p - 0.4) * 3);
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★ TRUSTED REVIEWER ★', 250, 310);
    ctx.globalAlpha = 1;
  }

  // Final tagline
  if (p > 0.5) {
    ctx.globalAlpha = ease((p - 0.5) * 3);
    ctx.fillStyle = WHITE;
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VeritasCompute', W/2, H - 65);
    ctx.fillStyle = PURPLE;
    ctx.font = '15px sans-serif';
    ctx.fillText('Honest monitors win. Liars go broke.', W/2, H - 38);
    ctx.globalAlpha = 1;
  }
}

// --- Main loop ---
function draw(timestamp) {
  if (!start) start = timestamp;
  const elapsed = (timestamp - start) % LOOP;

  // Clear
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // Cross-fade transitions
  const fadeDur = 300;
  const scenes = [
    [0, 2000, scene1],
    [2000, 5000, scene2],
    [5000, 7000, scene3],
    [7000, 10000, scene4],
    [10000, 12000, scene5],
  ];

  for (const [tStart, tEnd, fn] of scenes) {
    if (elapsed >= tStart && elapsed < tEnd) {
      // Fade in
      if (elapsed - tStart < fadeDur) {
        ctx.globalAlpha = (elapsed - tStart) / fadeDur;
      } else if (tEnd - elapsed < fadeDur && tEnd < LOOP) {
        ctx.globalAlpha = (tEnd - elapsed) / fadeDur;
      } else {
        ctx.globalAlpha = 1;
      }
      fn(elapsed);
      ctx.globalAlpha = 1;
    }
  }

  // Progress bar
  ctx.fillStyle = '#21262d';
  ctx.fillRect(0, H - 3, W, 3);
  ctx.fillStyle = PURPLE;
  ctx.fillRect(0, H - 3, W * (elapsed / LOOP), 3);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
